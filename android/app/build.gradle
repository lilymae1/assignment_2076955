plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.assignment_2076955"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.example.assignment_2076955"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode flutter.versionCode.toInteger() // Fixed here
        versionName flutter.versionName // Fixed here
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug // Ensure you're using your debug key
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3' 
}

